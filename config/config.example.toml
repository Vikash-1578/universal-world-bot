# Copy to config/config.toml to change defaults. Secrets do NOT go here (use .env / keys.txt).
[hub]
timezone = "Asia/Kolkata"
data_dir = "data"            # projects, assets, renders, database, backups
max_heavy_workers = 1         # renders / AI at the same time (16 GB RAM -> 1 is safest)
max_light_workers = 2
log_level = "INFO"

[render]
fps = 30

[storage]
temp_retention_days = 7       # planned (Milestone 10): automatic clean-up of old temp render files is NOT implemented yet

[tools]
ffmpeg = ""                   # empty = auto-detect
blender = ""

[llm]
# Local AI (free, private): install Ollama from ollama.com, then e.g. `ollama pull llama3.1:8b`
ollama_url = "http://127.0.0.1:11434"
ollama_model = ""             # empty = first installed model
# Cloud model overrides (used only when Cloud AI is ON in Settings)
# [llm.models]
# groq = "llama-3.3-70b-versatile"

[image]
# Local image AI (ComfyUI) for character / background pictures. Optional — you can always upload your own images.
comfyui_url = "http://127.0.0.1:8188"
checkpoint = ""               # e.g. "sd_xl_base_1.0.safetensors"; empty = first checkpoint ComfyUI has
steps = 24
